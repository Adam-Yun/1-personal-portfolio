
<div class="chatbot-container" id="chatbotContainer">
    <div class="chatbot-chat-box" id="chatbotChatBox">

        <div class="chat-box" id="chatBox">

        </div>

        <div class="text-box-container">
            <input type="text" id="text" class="text" autocomplete="off">
            <button id="sendText" class="send-text" onclick="sendMessage(this)">
                Send
            </button>
        </div>
    </div>
    <button type="button" id="chatbotButton" class="chatbot-btn" onclick="checkIconClicked()" value="true"></button>
</div>
